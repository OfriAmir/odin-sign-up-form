<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ofri's Sign-Up Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="bananas-container">
        <img src="bananas.jpg" alt="Bananas" class="bananas-img">
        <div class="logo-container">
            <svg width="280" height="280">
                <defs>
                    <radialGradient id="grad1">
                        <stop offset="50%" stop-color="yellow" />
                        <stop offset="100%" stop-color="orange" />
                    </radialGradient>
                </defs>
                <circle
                    cx="140"
                    cy="140"
                    r="70"
                    fill="url(#grad1)"
                    stroke="rgb(0, 247, 255)"
                    stroke-width="5"
                />
                <line
                x1="110"
                y1="110"
                x2="125"
                y2="125"
                stroke="oklch(0.9 0.3 164)"
                stroke-width="2"
                />
                <line
                x1="125"
                y1="110"
                x2="110"
                y2="125"
                stroke="oklch(0.9 0.3 164)"
                stroke-width="2"
                />
                <line
                x1="170"
                y1="110"
                x2="155"
                y2="125"
                stroke="oklch(0.9 0.3 164)"
                stroke-width="2"
                />
                <line
                x1="155"
                y1="110"
                x2="170"
                y2="125"
                stroke="oklch(0.9 0.3 164)"
                stroke-width="2"
                />
                <polygon
                points="
                90, 170
                140, 190
                190, 170
                "
                fill="url(#grad1)"
                stroke="oklch(0.9 0.3 164)"
                stroke-width="2"/>            
            </svg>
            <div class="logo-name">Ofri</div>
        </div>
    </div>
    <form action="" method="get">
        <p>This Is not a real online service! You know you need something like that in your life to help you realize your deepest dream.<br>Sign up <em>now</em> to get started with your eternal, everlating journey.<br><br>You <em>know</em> you want this.
        </p>
    </form>
</body>
</html>
